services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: knightfall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: knightfall
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knightfall"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      KNIGHTFALL_DATABASE_URL: postgresql+psycopg://knightfall:${POSTGRES_PASSWORD}@db:5432/knightfall
      KNIGHTFALL_CORS_ORIGINS: ${KNIGHTFALL_CORS_ORIGINS:-}
      # Proxies whose X-Forwarded-For uvicorn trusts (the login throttle counts per client IP).
      # Set it to the load balancer's address; "*" only when nothing else can reach the port.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
